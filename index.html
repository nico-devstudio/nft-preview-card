<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <title>NFT preview card component</title>
</head>

<body>

  <div class="main">
    <div class="image-container">
      <img class="equilibrium" src="./images/image-equilibrium.jpg" alt="equilibrium">
      <div class="overlay">
        <img src="./images/icon-view.svg" alt="icon-view">
      </div>
    </div>
    <div class="texts">
      <button class="equitext">Equilibrium # 3429</button> <br>
      <span class="transparent">Our Equilibrium collection promotes <br> balance and calm.</span>
      <div class="eth">
        <div class="zerofourone"><img src="./images/icon-ethereum.svg" alt="icon-ethereum">0.041 ETH</div>
        <div class="transparent">3 days left</div>
      </div>
      <hr class="transparent">
    </div>
    <div class="creation"><img class="avatar" src="./images/image-avatar.png" alt="image-avatar">
      <div>Creation of <button class="jules">Jules Wyvern</button></div>
    </div>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Nico Angelo Garilva</a>.
  </footer>
</body>

</html>
